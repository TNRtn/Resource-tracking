
<div class="project-layout">

  <!-- Mobile Toggle Button -->
  <button class="btn btn-primary sidebar-toggle d-lg-none"
          type="button"
          (click)="toggleSidebar()">
    <i class="bi"
       [ngClass]="isSidebarOpen ? 'bi-x-lg' : 'bi-list'">
    </i>
    {{ isSidebarOpen ? 'Close Menu' : 'Open Menu' }}
  </button>

  <!-- Sidebar -->
  <aside class="sidebar"
         [class.show]="isSidebarOpen">

    <h4 class="sidebar-title">{{ projectName }}</h4>

    @for (menu of menus; track menu.id) {

      <div class="menu-item"
           (click)="navigateToMenu(menu)">

        <i class="bi bi-grid"></i>

        <span>{{ menu.name }}</span>

      </div>

    }

  </aside>

  <!-- Mobile Overlay -->
  @if (isSidebarOpen) {
    <div class="sidebar-overlay d-lg-none"
         (click)="toggleSidebar()">
    </div>
  }

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
